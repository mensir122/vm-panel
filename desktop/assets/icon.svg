<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="3"/>

  <!-- Subtle Cyber Grid -->
  <path d="M 8 64 H 248 M 8 128 H 248 M 8 192 H 248 M 64 8 V 248 M 128 8 V 248 M 192 8 V 248" 
        stroke="rgba(6, 182, 212, 0.08)" stroke-width="1.5"/>

  <!-- Stylized V Symbol (VM-Panel) -->
  <path d="M68 76 L128 184 L188 76" 
        fill="none" 
        stroke="url(#cyanGlow)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Core Neon Pulse Indicator -->
  <circle cx="128" cy="120" r="14" fill="#00ff9d" filter="url(#neonGlow)"/>
  <circle cx="128" cy="120" r="6" fill="#ffffff"/>

  <!-- Horizontal Tech Nodes -->
  <circle cx="68" cy="76" r="6" fill="#00f2fe"/>
  <circle cx="188" cy="76" r="6" fill="#00f2fe"/>
  <circle cx="128" cy="184" r="6" fill="#00f2fe"/>
</svg>
