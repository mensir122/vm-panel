# VM-Panel — CI untuk PR/push: unit tests + syntax check semua JS.
# Integration/security/recovery suite dijalankan lokal / nightly (lihat docs/TESTING.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check (node --check semua JS)
        run: |
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -n 1 node --check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security
