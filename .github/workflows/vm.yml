# VM-Panel — workflow utama (self-chain runner).
# Desain: docs/DESIGN.md §15, §24, keputusan D8a-D8c.
# - Ephemeral runner: job max 6 jam (timeout-minutes: 360).
# - Self-chain: sebelum timeout, dispatch run berikutnya via GITHUB_TOKEN
#   (workflow_dispatch = pengecualian eksplisit aturan non-triggering).
# - Anti split-brain: concurrency group + cek run in_progress lain + drain
#   berbasis job started_at (bukan jam runner) + final backup + health gate.
# - TANPA PAT: hanya GITHUB_TOKEN default.
# - Repo PUBLIC: state artifact WAJIB terenkripsi (runtime/vm-state.enc,
#   AES-256-GCM atas VPANEL_MASTER_KEY) — lihat scripts/state-container.mjs.

name: vm

on:
  workflow_dispatch:
    inputs:
      drill_job_minutes:
        description: 'Budget menit job untuk drill (default 360 = produksi)'
        required: false
        default: '360'
      drill_drain_minutes:
        description: 'Drain mulai t-N menit (default 15)'
        required: false
        default: '15'

concurrency:
  group: vm-chain
  cancel-in-progress: false

permissions:
  actions: write
  contents: write   # vault branch 'state': commit vm-state.enc otomatis

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # NB: RUNNER_ID / VM_PANEL_ENV TIDAK di-set di level job — jika job-wide,
      # unit test mewarisi env tersebut dan gagal assert 'local' (hermetic tests).
      # Scope env hanya ke step yang benar-benar membutuhkan.
      VPANEL_MASTER_KEY: ${{ secrets.VPANEL_MASTER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Runner specs (tercatat di log tiap siklus)
        run: node -p "JSON.stringify((()=>{const os=require('os'),fs=require('fs');const s=fs.statfsSync('.');return {CPU:os.cpus()[0].model.trim(),Cores:os.cpus().length,RAM_GB:+(os.totalmem()/2**30).toFixed(1),Disk_free_GB:+(s.bfree*s.bsize/2**30).toFixed(1),Disk_total_GB:+(s.blocks*s.bsize/2**30).toFixed(1),OS:os.type()+' '+os.release()}})())"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quick tests (unit only, batasi budget)
        run: npm run test:unit

      - name: Restore state (unduh + dekripsi artifact run sebelumnya)
        id: restore
        run: bash scripts/restore_state.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          VPANEL_MASTER_KEY: ${{ secrets.VPANEL_MASTER_KEY }}

      - name: Verify state integrity
        run: bash scripts/verify_state.sh

      - name: Start manager + panel
        run: |
          bash scripts/start_manager.sh
          bash scripts/start_panel.sh
        env:
          RUNNER_ID: ${{ github.run_id }}
          VM_PANEL_ENV: actions

      - name: Health gate (manager + panel wajib lulus)
        run: bash scripts/health_check.sh

      - name: Services + supervisor + keepalive + self-chain
        run: bash scripts/keepalive.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_JOB_MINUTES: ${{ inputs.drill_job_minutes || '360' }}
          RUNNER_DRAIN_MINUTES: ${{ inputs.drill_drain_minutes || '15' }}

      - name: Final backup sebelum shutdown
        if: always()
        run: bash scripts/backup_final.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_ID: ${{ github.run_id }}

      - name: Graceful shutdown
        if: always()
        run: bash scripts/stop_all.sh

      - name: Upload state TERENKRIPSI (untuk chain berikutnya & restore data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-state
          path: runtime/vm-state.enc
          retention-days: 30
          if-no-files-found: warn

      - name: Upload chain lock (watchdog recovery.yml membaca ini)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-chain-lock
          path: runtime/chain-lock.json
          retention-days: 2
          if-no-files-found: warn
