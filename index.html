<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9Router VPS 24/7 Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .footer { margin-top: 24px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span> Online 24/7</div>
    <div class="loader" id="spinner"></div>
    <h1>9Router Gateway</h1>
    <p id="desc">Menghubungkan Anda ke server 9Router aktif...</p>
    <a id="link-btn" class="btn" href="#" style="display: none;">Buka 9Router Sekarang</a>
    <div class="footer">VPS Tetap Aktif Walau Laptop Anda Dimatikan</div>
  </div>

  <script>
    async function initGateway() {
      const desc = document.getElementById("desc");
      const btn = document.getElementById("link-btn");
      const spinner = document.getElementById("spinner");

      try {
        const rawUrl = "https://raw.githubusercontent.com/mensir122/vm-panel/state/PUBLIC_URL.txt?nocache=" + Date.now();
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error("Gagal mengambil data URL");
        const url = (await res.text()).trim();

        if (url && url.startsWith("http")) {
          desc.innerText = "Mengalihkan ke server aktif...";
          btn.href = url;
          btn.style.display = "inline-block";
          window.location.replace(url);
        } else {
          spinner.style.display = "none";
          desc.innerText = "Server sedang estafet (restart). Coba lagi dalam beberapa detik.";
        }
      } catch (err) {
        spinner.style.display = "none";
        desc.innerText = "Gagal memuat URL 9Router: " + err.message;
      }
    }
    initGateway();
  </script>
</body>
</html>
