<!doctype html>
<!--
  VPANEL template: services.html
  Service instances table with lifecycle actions. Requires a session.

  VARS (written as [key|raw] here to avoid template substitution
  inside this comment; the real placeholders use double braces):

    [nav|raw]           sidebar nav fragment, "Services" active.
    [user]              escaped username.
    [banner|raw]        optional banner fragment (div.alert...), or empty.
    [flash|raw]         one-shot flash fragment, or empty.
    [servicesTable|raw] either the services table:
                        <div class="table-wrap">
                          <table class="table">
                            <thead><tr>
                              <th scope="col">ID</th>
                              <th scope="col">Project</th>
                              <th scope="col">Status</th>
                              <th scope="col">PID</th>
                              <th scope="col">Port</th>
                              <th scope="col">Actions</th>
                            </tr></thead>
                            <tbody>
                              <tr>
                                <td class="mono">svc_01ABC...</td>
                                <td><a href="/projects/prj_...">api-gateway</a></td>
                                <td><span class="status">
                                  <span class="dot dot--healthy" role="img"
                                    aria-label="status: healthy"></span> healthy</span></td>
                                <td class="mono">14233</td>
                                <td class="mono">10001</td>
                                <td>
                                  <div class="table__actions">
                                    <form method="post" action="/services/svc_.../stop">
                                      <button class="btn btn--sm" type="submit"
                                        data-confirm="Stop service api-gateway?">Stop</button>
                                    </form>
                                    <form method="post" action="/services/svc_.../restart">
                                      <button class="btn btn--sm"
                                        data-confirm="Restart service api-gateway?">Restart</button>
                                    </form>
                                    (start: class "btn btn--sm btn--primary",
                                     shown only when status is stopped)
                                  </div>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                        or the empty state:
                        <div class="empty">
                          <p class="empty__title">No services.</p>
                          <p class="empty__hint">Services appear once a
                            project has been deployed.</p>
                        </div>

    Two-phase confirm contract (panel.js):
      - data-confirm           short summary shown in the dialog
      - data-confirm-detail    optional extra context lines
      - data-confirm-phrase    optional string the operator must type
      The server must still enforce its own two-phase confirmation.
      Button labels: Start / Stop / Restart — exactly one primary
      action (Start) per row, the rest neutral.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Services — VPANEL</title>
  <link rel="stylesheet" href="/static/panel.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='%2358a6ff' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="app__sidebar">
      <div class="brand">
        <a class="brand__mark" href="/dashboard">VPANEL</a>
        <span class="brand__sub">VM-Panel</span>
      </div>
      {{nav|raw}}
      <div class="app__sidebar-foot">VM-Panel · operations console</div>
    </aside>

    <div class="app__main">
      <header class="topbar">
        <span class="topbar__user">{{user}}</span>
        <form method="post" action="/logout">
          <button class="btn btn--ghost" type="submit">Log out</button>
        </form>
      </header>

      <div class="notices">
        {{banner|raw}}
        {{flash|raw}}
      </div>

      <main class="page" id="main">
        <div class="page__header">
          <div>
            <h1 class="page__title">Services</h1>
            <p class="page__meta">Running service instances and lifecycle controls</p>
          </div>
        </div>

        <div class="page__stack">
          {{servicesTable|raw}}
        </div>
      </main>

      <footer class="footer">
        <span class="mono">VPANEL</span>
        <span>Stop and restart require confirmation; the manager enforces a second phase.</span>
      </footer>
    </div>
  </div>

  <script src="/static/panel.js" defer></script>
</body>
</html>
