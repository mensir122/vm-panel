<!doctype html>
<!--
  VPANEL template: logs.html
  Log viewer: file selector + mono log output. Requires a session.

  VARS (written as [key|raw] here to avoid template substitution
  inside this comment; the real placeholders use double braces):

    [nav|raw]       sidebar nav fragment, "Logs" active.
    [user]          escaped username.
    [banner|raw]    optional banner fragment (div.alert...), or empty.
    [flash|raw]     one-shot flash fragment, or empty.
    [logSelector|raw] file selector card, suggested shape:
                    <section class="card">
                      <header class="card__header">
                        <h2 class="card__title">Log file</h2>
                      </header>
                      <div class="card__body">
                        <form class="filters" method="get" action="/logs">
                          <div class="field">
                            <label class="field__label" for="log-file">File</label>
                            <select class="field__input field__input--mono"
                              id="log-file" name="file">
                              <option value="panel.log">panel/panel.log</option>
                              <option value="manager.log">manager/manager.log</option>
                            </select>
                          </div>
                          <button class="btn" type="submit">Open</button>
                        </form>
                      </div>
                    </section>
    [logContent|raw] either:
                    <pre class="log" tabindex="0" data-autoscroll
                      aria-label="Log output">...log lines...</pre>
                    (mono, keyboard-scrollable, auto-pinned to bottom
                    while the operator is near the bottom; panel.js
                    enhances with [data-autoscroll]), or:
                    <div class="empty">
                      <p class="empty__title">Log file is empty.</p>
                      <p class="empty__hint">Output appears once the
                        component writes to it.</p>
                    </div>

    Notes: log lines must be pre-escaped server-side. Do not wrap
    the content in extra markup; the <pre class="log"> carries the
    styling. Cap rendered tail length server-side (e.g. last 500
    lines) and note truncation in banner or flash if needed.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Logs — VPANEL</title>
  <link rel="stylesheet" href="/static/panel.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='%2358a6ff' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="app__sidebar">
      <div class="brand">
        <a class="brand__mark" href="/dashboard">VPANEL</a>
        <span class="brand__sub">VM-Panel</span>
      </div>
      {{nav|raw}}
      <div class="app__sidebar-foot">VM-Panel · operations console</div>
    </aside>

    <div class="app__main">
      <header class="topbar">
        <span class="topbar__user">{{user}}</span>
        <form method="post" action="/logout">
          <button class="btn btn--ghost" type="submit">Log out</button>
        </form>
      </header>

      <div class="notices">
        {{banner|raw}}
        {{flash|raw}}
      </div>

      <main class="page" id="main">
        <div class="page__header">
          <div>
            <h1 class="page__title">Logs</h1>
            <p class="page__meta">Recent output from panel, manager and project logs</p>
          </div>
        </div>

        <div class="page__stack">
          {{logSelector|raw}}
          {{logContent|raw}}
        </div>
      </main>

      <footer class="footer">
        <span class="mono">VPANEL</span>
        <span>View stays pinned to the bottom until you scroll up.</span>
      </footer>
    </div>
  </div>

  <script src="/static/panel.js" defer></script>
</body>
</html>
