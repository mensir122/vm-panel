<!doctype html>
<!--
  VPANEL template: audit.html
  Append-only audit trail with GET filters. Requires a session.

  VARS (written as [key|raw] here to avoid template substitution
  inside this comment; the real placeholders use double braces):

    [nav|raw]       sidebar nav fragment, "Audit" active.
    [user]          escaped username.
    [banner|raw]    optional banner fragment (div.alert...), or empty.
    [flash|raw]     one-shot flash fragment, or empty.
    [filterForm|raw] filter card, suggested shape:
                    <section class="card">
                      <header class="card__header">
                        <h2 class="card__title">Filters</h2>
                      </header>
                      <div class="card__body">
                        <form class="filters" method="get" action="/audit">
                          <div class="field">
                            <label class="field__label" for="f-actor">Actor</label>
                            <input class="field__input" type="text" id="f-actor"
                              name="actor" value="...">
                          </div>
                          <div class="field">
                            <label class="field__label" for="f-operation">Operation</label>
                            <input class="field__input mono" type="text"
                              id="f-operation" name="operation" value="...">
                          </div>
                          <div class="field">
                            <label class="field__label" for="f-result">Result</label>
                            <select class="field__input" id="f-result" name="result">
                              <option value="">all</option>
                              <option value="ok">ok</option>
                              <option value="fail">fail</option>
                            </select>
                          </div>
                          <button class="btn" type="submit">Apply</button>
                        </form>
                      </div>
                    </section>
                    (every input needs a programmatic label; keep
                    current values in value="" so filters persist)
    [auditTable|raw] either the audit table:
                    <div class="table-wrap">
                      <table class="table">
                        <thead><tr>
                          <th scope="col">Time UTC</th>
                          <th scope="col">Actor</th>
                          <th scope="col">Operation</th>
                          <th scope="col">Project</th>
                          <th scope="col">Result</th>
                        </tr></thead>
                        <tbody>
                          <tr>
                            <td class="mono">2026-09-04 12:00:30</td>
                            <td>owner</td>
                            <td class="mono">service.restart</td>
                            <td class="mono">prj_01ABC...</td>
                            <td><span class="badge badge--ok">ok</span></td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    or the empty state:
                    <div class="empty">
                      <p class="empty__title">No audit events match.</p>
                      <p class="empty__hint">Adjust or clear the filters.</p>
                    </div>

    Notes: timestamps must be UTC ISO-8601 in mono; operation names
    are dot-notation (service.restart, deployment.rollback, ...);
    result badge mapping ok=badge--ok, fail=badge--err, warn=badge--warn.
    The audit log is append-only; there are no row actions.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Audit — VPANEL</title>
  <link rel="stylesheet" href="/static/panel.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='%2358a6ff' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="app__sidebar">
      <div class="brand">
        <a class="brand__mark" href="/dashboard">VPANEL</a>
        <span class="brand__sub">VM-Panel</span>
      </div>
      {{nav|raw}}
      <div class="app__sidebar-foot">VM-Panel · operations console</div>
    </aside>

    <div class="app__main">
      <header class="topbar">
        <span class="topbar__user">{{user}}</span>
        <form method="post" action="/logout">
          <button class="btn btn--ghost" type="submit">Log out</button>
        </form>
      </header>

      <div class="notices">
        {{banner|raw}}
        {{flash|raw}}
      </div>

      <main class="page" id="main">
        <div class="page__header">
          <div>
            <h1 class="page__title">Audit</h1>
            <p class="page__meta">Append-only event log, UTC timestamps</p>
          </div>
        </div>

        <div class="page__stack">
          {{filterForm|raw}}
          {{auditTable|raw}}
        </div>
      </main>

      <footer class="footer">
        <span class="mono">VPANEL</span>
        <span>Audit events cannot be edited or deleted from the panel.</span>
      </footer>
    </div>
  </div>

  <script src="/static/panel.js" defer></script>
</body>
</html>
