<!doctype html>
<!--
  VPANEL template: settings.html
  Read-only system information. Configuration editing stays in
  config files / CLI by design. Requires a session.

  VARS (written as [key|raw] here to avoid template substitution
  inside this comment; the real placeholders use double braces):

    [nav|raw]        sidebar nav fragment, "Settings" active.
    [user]           escaped username.
    [banner|raw]     optional banner fragment (div.alert...), or empty.
    [flash|raw]      one-shot flash fragment, or empty.
    [settingsGrid|raw] one or more read-only info cards, suggested shape:
                     <section class="card">
                       <header class="card__header">
                         <h2 class="card__title">System</h2>
                       </header>
                       <div class="card__body">
                         <dl class="kv">
                           <dt class="kv__key">Panel version</dt>
                           <dd class="kv__value mono">0.1.0</dd>
                           <dt class="kv__key">Node</dt>
                           <dd class="kv__value mono">v20.x.x</dd>
                           <dt class="kv__key">Platform</dt>
                           <dd class="kv__value mono">linux x64</dd>
                           <dt class="kv__key">Runner phase</dt>
                           <dd class="kv__value mono">running</dd>
                           <dt class="kv__key">DB integrity</dt>
                           <dd class="kv__value mono">ok</dd>
                         </dl>
                       </div>
                     </section>
                     Additional cards may use titles: Runtime,
                     Storage, Limits. All values are display-only;
                     there are no inputs or actions on this page.

    Placeholder section: if a subsystem has nothing to report, the
    server renders a card with an inner div.empty ("No data").
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Settings — VPANEL</title>
  <link rel="stylesheet" href="/static/panel.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='%2358a6ff' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="app__sidebar">
      <div class="brand">
        <a class="brand__mark" href="/dashboard">VPANEL</a>
        <span class="brand__sub">VM-Panel</span>
      </div>
      {{nav|raw}}
      <div class="app__sidebar-foot">VM-Panel · operations console</div>
    </aside>

    <div class="app__main">
      <header class="topbar">
        <span class="topbar__user">{{user}}</span>
        <form method="post" action="/logout">
          <button class="btn btn--ghost" type="submit">Log out</button>
        </form>
      </header>

      <div class="notices">
        {{banner|raw}}
        {{flash|raw}}
      </div>

      <main class="page" id="main">
        <div class="page__header">
          <div>
            <h1 class="page__title">Settings</h1>
            <p class="page__meta">System information (read-only)</p>
          </div>
        </div>

        <div class="page__stack">
          {{settingsGrid|raw}}
        </div>
      </main>

      <footer class="footer">
        <span class="mono">VPANEL</span>
        <span>Configuration changes are made in config files, not in the panel.</span>
      </footer>
    </div>
  </div>

  <script src="/static/panel.js" defer></script>
</body>
</html>
